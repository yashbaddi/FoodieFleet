openapi: 3.0.0
info:
  title: FoodieFleet API Documentation
  version: 1.0.0
  description: Comprehensive, systematic REST and WebSocket API documentation for FoodieFleet multi-service food delivery platform.
  contact:
    name: FoodieFleet Development Team
servers:
  - url: /api
    description: API Base Path (/api)
  - url: /
    description: Root Base Path (/)

tags:
  - name: Authentication
    description: User authentication, registration, and session management
  - name: Restaurants
    description: Restaurant profiles, menus, and owner operations
  - name: Orders
    description: Order placement, status tracking, and fulfillment
  - name: Cart
    description: Shopping cart management for customers
  - name: Drivers
    description: Delivery driver profiles and real-time streaming
  - name: Users
    description: User accounts and live tracking
  - name: Health
    description: Service health and dependency checks

paths:
  /auth/login:
    post:
      summary: User login
      tags:
        - Authentication
      description: Authenticate user using email and password, setting an HTTP-only JWT token cookie upon success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: password123
      responses:
        "200":
          description: Login successful. Token cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      role:
                        type: string
        "400":
          description: Invalid input or missing credentials.
        "401":
          description: Invalid email or password.

  /auth/register:
    post:
      summary: User registration
      tags:
        - Authentication
      description: Register a new user account (customer, restaurant owner, or driver).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: janedoe@example.com
                password:
                  type: string
                  example: securePassword123
                role:
                  type: string
                  enum:
                    - customer
                    - restaurant_owner
                    - driver
                  default: customer
                phone:
                  type: string
                  example: "+1234567890"
      responses:
        "201":
          description: User registered successfully.
        "400":
          description: Email already registered or invalid fields.

  /auth/logout:
    post:
      summary: User logout
      tags:
        - Authentication
      description: Log out current user and clear token authentication cookie.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully.

  /auth/me:
    get:
      summary: Get current authenticated user details
      tags:
        - Authentication
      description: Fetch details of the currently authenticated user session.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user details.
        "401":
          description: Unauthorized - missing or invalid authentication token.

  /cart:
    get:
      summary: Fetch active user cart
      tags:
        - Cart
      description: Retrieve all items currently in the logged-in user's shopping cart.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Cart details retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        itemId:
                          type: string
                        quantity:
                          type: integer
                        name:
                          type: string
                        price:
                          type: number
        "401":
          description: Unauthorized.
    put:
      summary: Update active user cart
      tags:
        - Cart
      description: Update items or quantities in the user's shopping cart.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - itemId
                      - quantity
                    properties:
                      itemId:
                        type: string
                      quantity:
                        type: integer
      responses:
        "200":
          description: Cart updated successfully.
        "400":
          description: Invalid cart payload.
        "401":
          description: Unauthorized.

  /driver/ws:
    get:
      summary: Delivery Driver WebSocket stream
      tags:
        - Drivers
      description: Real-time WebSocket connection for delivery partners to stream GPS location updates and accept/update order delivery status.
      security:
        - cookieAuth: []
      responses:
        "101":
          description: Switching protocols to WebSocket stream.

  /driver:
    get:
      summary: Get driver account & assignment details
      tags:
        - Drivers
      description: Retrieve active driver profile, current status, vehicle information, and assigned delivery order.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Driver details retrieved successfully.
        "401":
          description: Unauthorized.

  /health:
    get:
      summary: System health check
      tags:
        - Health
      description: Returns server operational status and health of dependent services (PostgreSQL and Redis).
      responses:
        "200":
          description: Server and dependencies are healthy (UP).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  timestamp:
                    type: string
                    example: "2026-08-31T20:00:00.000Z"
                  uptime:
                    type: number
                    example: 1245.5
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                        example: connected
                      redis:
                        type: string
                        example: connected
        "503":
          description: Server is degraded or dependencies are disconnected.

  /orders:
    get:
      summary: Get user orders
      tags:
        - Orders
      description: Retrieve all past and current orders for the logged-in user.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of user orders.
        "401":
          description: Unauthorized.
    post:
      summary: Create new order
      tags:
        - Orders
      description: Place a new food delivery order from a restaurant.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - restaurantId
                - items
                - deliveryAddress
              properties:
                restaurantId:
                  type: string
                deliveryAddress:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - itemId
                      - quantity
                    properties:
                      itemId:
                        type: string
                      quantity:
                        type: integer
      responses:
        "201":
          description: Order placed successfully.
        "400":
          description: Invalid order parameters.
        "401":
          description: Unauthorized.

  /orders/{id}:
    get:
      summary: Get order details by ID
      tags:
        - Orders
      description: Fetch comprehensive details for a specific order.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Unique order ID.
      responses:
        "200":
          description: Order details.
        "404":
          description: Order not found.
    patch:
      summary: Update order status or details
      tags:
        - Orders
      description: Update an order's status (e.g. status transition like PREPARING, OUT_FOR_DELIVERY, DELIVERED).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Unique order ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: PREPARING
      responses:
        "200":
          description: Order updated successfully.
        "400":
          description: Invalid update payload.
        "404":
          description: Order not found.

  /restaurants/ws:
    get:
      summary: Restaurant Owner WebSocket stream
      tags:
        - Restaurants
      description: Real-time WebSocket connection for restaurant owners to monitor order incoming status and request driver locations.
      security:
        - cookieAuth: []
      responses:
        "101":
          description: Switching protocols to WebSocket stream.

  /restaurants:
    get:
      summary: List all active restaurants
      tags:
        - Restaurants
      description: Retrieve all available restaurants.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of active restaurants.
    post:
      summary: Create new restaurant
      tags:
        - Restaurants
      description: Add a new restaurant profile.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - address
                - cuisine
              properties:
                name:
                  type: string
                address:
                  type: string
                cuisine:
                  type: string
                openingHours:
                  type: string
      responses:
        "201":
          description: Restaurant created.
        "400":
          description: Missing or invalid parameters.

  /restaurants/{id}:
    get:
      summary: Get restaurant by ID
      tags:
        - Restaurants
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restaurant details.
        "404":
          description: Restaurant not found.
    put:
      summary: Update restaurant details
      tags:
        - Restaurants
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Restaurant updated.
    delete:
      summary: Delete restaurant by ID
      tags:
        - Restaurants
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restaurant deleted.

  /restaurants/{restaurantID}/items:
    get:
      summary: Get menu items for restaurant
      tags:
        - Restaurants
      parameters:
        - in: path
          name: restaurantID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Menu items list.
    post:
      summary: Add new menu item to restaurant
      tags:
        - Restaurants
      parameters:
        - in: path
          name: restaurantID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
              properties:
                name:
                  type: string
                price:
                  type: number
                description:
                  type: string
      responses:
        "201":
          description: Menu item added.

  /restaurants/{restaurantID}/items/{itemID}:
    put:
      summary: Update menu item
      tags:
        - Restaurants
      parameters:
        - in: path
          name: restaurantID
          required: true
          schema:
            type: string
        - in: path
          name: itemID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Menu item updated.
    delete:
      summary: Delete menu item
      tags:
        - Restaurants
      parameters:
        - in: path
          name: restaurantID
          required: true
          schema:
            type: string
        - in: path
          name: itemID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Menu item deleted.

  /user/ws:
    get:
      summary: Customer Tracking WebSocket stream
      tags:
        - Users
      description: Real-time WebSocket connection for customers to track assigned delivery driver location and live order status.
      security:
        - cookieAuth: []
      responses:
        "101":
          description: Switching protocols to WebSocket stream.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT authentication token passed via HTTP-only cookie.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authorization token passed in Authorization header.

