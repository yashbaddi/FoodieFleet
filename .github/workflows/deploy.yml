name: Deploy FoodieFleet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1. Checkout repository
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # 2. Login to Docker Hub
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------
      # 3. Build & push backend
      # -------------------------
      - name: Build and push Node server
        uses: docker/build-push-action@v6
        with:
          context: ./apps/node-server
          file: ./apps/node-server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/foodiefleet-server:${{ github.sha }}

      # -------------------------
      # 4. Build & push frontend
      # -------------------------
      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/foodiefleet-web:${{ github.sha }}

      # -------------------------
      # 5. Copy deployment files
      # -------------------------
      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,migrations/schema.sql"
          target: "~/FoodieFleet"

      # -------------------------
      # 6. Deploy to EC2
      # -------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/FoodieFleet

            echo "Deploying commit: ${{ github.sha }}"

            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
       
            docker compose up -d

            docker image prune -f

            echo "Deployment complete!"

            docker compose ps
