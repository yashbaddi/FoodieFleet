name: Deploy FoodieFleet

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1. Checkout repository
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # 2. Login to Docker Hub
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------
      # 3. Build & push backend
      # -------------------------
      - name: Build and push Node server
        uses: docker/build-push-action@v6
        with:
          context: ./apps/node-server
          file: ./apps/node-server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodiefleet-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/foodiefleet-server:${{ github.sha }}

      # -------------------------
      # 4. Build & push frontend
      # -------------------------
      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/foodiefleet-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/foodiefleet-web:${{ github.sha }}

      # -------------------------
      # 5. Deploy to EC2
      # -------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/FoodieFleet

            echo "Pulling latest images..."
            docker compose pull

            echo "Starting containers..."
            docker compose up -d

            echo "Removing unused images..."
            docker image prune -f

            echo "Deployment complete!"
            docker compose ps
